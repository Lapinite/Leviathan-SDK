<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#173b51"/><text x="42" y="44" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN SDK // PUBLIC INTERFACE FLOW</text><text x="42" y="68" fill="#7d9fb2" font-family="Segoe UI,Arial" font-size="12">Applications and plugins use the SDK to reach intentionally public Leviathan contracts without exposing private platform internals.</text><path id="p" d="M115 215 H1085" fill="none" stroke="#174c66" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#63f2ff" filter="url(#g)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g><rect x="60" y="150" width="220" height="130" rx="16" fill="#061722" stroke="#20bfdd"/><text x="170" y="188" fill="#eefcff" font-size="17" font-weight="750">APP / PLUGIN / TOOL</text><text x="170" y="215" fill="#8aa7b7" font-size="10">developer-owned code</text><text x="170" y="236" fill="#688a9d" font-size="10">credentials remain with the application</text></g><g><rect x="350" y="135" width="230" height="160" rx="18" fill="#061a28" stroke="#36e4f7" stroke-width="2.5" filter="url(#g)"/><text x="465" y="184" fill="#eefcff" font-size="22" font-weight="800">LEVIATHAN SDK</text><text x="465" y="216" fill="#62dce9" font-size="10">typed clients • models • errors</text><text x="465" y="238" fill="#62dce9" font-size="10">pagination • webhooks • compatibility</text><text x="465" y="260" fill="#6